<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ezzzzzz88</title>
<meta name="description" content="ezzzzzz88 — web developer.">
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:#05060a;
    color:#e8e9ef;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  #sky{ position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  main{
    position:relative;
    z-index:1;
    min-height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:24px;
    max-width:520px;
    margin:0 auto;
  }
  h1{
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    font-weight:600;
    letter-spacing:-0.02em;
    margin:0 0 14px;
  }
  p{ margin:0 0 10px; color:#aeb2c4; line-height:1.6; }
  .links{ margin-top:18px; display:flex; gap:20px; flex-wrap:wrap; }
  a{ color:#9db4ff; text-decoration:none; }
  a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main>
  <h1>ezzzzzz88</h1>
  <p>Web developer. Three years in, mostly JavaScript and React.</p>
  <p>Self-taught, still learning, always building something.</p>
  <div class="links">
    <a href="https://github.com/ezzzzzz88" target="_blank" rel="noopener">GitHub</a>
    <a href="mailto:samuelsimoni850@gmail.com">Email</a>
  </div>
</main>

<script>
(function(){
  "use strict";
  var c = document.getElementById('sky'), ctx = c.getContext('2d');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, DPR, stars;
  function build(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = W*DPR; c.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    stars = [];
    var n = Math.round((W*H)/6500);
    for (var i=0;i<n;i++){
      var d = Math.random();
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:0.4+d*1.4,
        vx:(-4-d*10)*(reduced?0:1),
        tw:Math.random()*6.28, ts:0.5+Math.random()*1.5,
        base:0.2+d*0.55
      });
    }
  }
  var last=0;
  function frame(now){
    var dt=Math.min((now-last)/1000,0.05)||0; last=now;
    ctx.clearRect(0,0,W,H);
    for (var i=0;i<stars.length;i++){
      var s=stars[i];
      if(!reduced){ s.x+=s.vx*dt; s.tw+=s.ts*dt; if(s.x<-4){s.x=W+4;s.y=Math.random()*H;} }
      var a=s.base*(reduced?1:(0.68+0.32*Math.sin(s.tw)));
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832);
      ctx.fillStyle='rgba(255,255,255,'+Math.max(0,a)+')'; ctx.fill();
    }
    if(!reduced) requestAnimationFrame(frame);
  }
  build(); reduced?frame(0):requestAnimationFrame(frame);
  var rt; addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){build(); if(reduced)frame(0);},150); });
})();
</script>
</body>
</html>
